# Dotbot configuration. Paths on the right are relative to the repository root.
- defaults:
    link:
      create: true
      force: true
      relink: true
      relative: false

- link:
    ~/.config/nvim: nvim/.config/nvim
    ~/.config/yazi: yazi/.config/yazi
    ~/.config/wezterm: wezterm/.config/wezterm
    ~/.config/glow: glow/.config/glow
    ~/.config/rclone: rclone/.config/rclone
    ~/.config/starship.toml: starship/.config/starship.toml
    ~/.config/.crossnote: crossnote/.config/.crossnote
    ~/.config/obsidian/init.lua: obsidian/.config/obsidian/init.lua
    ~/Documents/PowerShell: powershell/Documents/PowerShell
    ~/Documents/WindowsPowerShell: powershell/Documents/PowerShell
    ~/AppData/Roaming/Rime: rime-config\rime
    "D:/0作业/文学/郁玺的日记/2026年/.obsidian": obsidian/obconfig/.obsidian
    "D:/0作业/文学/novel/.obsidian": obsidian/obconfig/.obsidian
